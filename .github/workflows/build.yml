name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lineageos-archive-downloader-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build release APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Publish GitHub Release 1.0.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo "v1.0.0 already exists; release step is complete."
            exit 0
          fi

          gh release create v1.0.0 \
            app/build/outputs/apk/release/app-release.apk \
            --title "LineageOS Archive Downloader 1.0.0" \
            --latest \
            --notes "## LineageOS Archive Downloader 1.0.0

First public release of the downloader/checker.

### Highlights
- Beautiful updater-style interface inspired by modern translucent system UI.
- Polished Liquid Glass-inspired navigation layer adapted for Android.
- Correct light and dark themes with strong text contrast.
- Automatic device detection with manual device search.
- Checks official LineageOS builds and displays version, date, size, Android SDK, patch level and SHA-256.
- Background downloads with pause/resume when supported by the server.
- Local SHA-256 verification after every download when a trusted digest is supplied.
- Clearly separated TimSchumi unofficial archive for older builds.
- Never unlocks, flashes, changes recovery or modifies partitions.

### Signing
This 1.0.0 public CI build uses the standard Android debug signing key because no private production keystore is stored in the public repository."
