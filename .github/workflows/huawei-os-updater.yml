name: Huawei OS Updater Android APK

on:
  push:
    branches: [huawei-os-updater]
    paths:
      - "huawei-os-updater/**"
      - ".github/workflows/huawei-os-updater.yml"
  pull_request:
    paths:
      - "huawei-os-updater/**"
      - ".github/workflows/huawei-os-updater.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
        working-directory: huawei-os-updater

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Huawei-OS-Updater-debug
          path: huawei-os-updater/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
