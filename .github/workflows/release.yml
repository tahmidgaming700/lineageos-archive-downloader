name: Publish Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Check whether v1.0.2 already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        if: steps.existing.outputs.exists != 'true'
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Publish v1.0.2
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.2 app/build/outputs/apk/release/app-release.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "LineageOS Archive Downloader 1.0.2" \
            --notes "## LineageOS Archive Downloader 1.0.2\n\n- EMUI-inspired Software Update download interface\n- Circular download progress and updater-style status\n- Android 5.0+ support\n- Light, dark and system appearance modes\n- SHA-256 verification after downloads\n- Official LineageOS builds plus clearly labeled unofficial archive support\n\nThis release is a downloader and verifier only; it never flashes or modifies device partitions."

      - name: Release already published
        if: steps.existing.outputs.exists == 'true'
        run: echo "v1.0.2 is already published; nothing to do."
